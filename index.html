<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на день рождения Миланы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 100%);
            color: #5a3d5c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .invitation-card {
            max-width: 800px;
            width: 100%;
            background-color: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(154, 91, 157, 0.2);
            position: relative;
        }

        .header {
            background: linear-gradient(to right, #d291bc, #9c5b9d);
            color: white;
            text-align: center;
            padding: 40px 20px;
            position: relative;
        }

        .header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(to right, #ff9a9e, #fad0c4, #fad0c4, #ff9a9e);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            opacity: 0.9;
        }

        .content {
            display: flex;
            flex-direction: column;
            padding: 40px;
        }

        .photo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .photo-frame {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 25px;
            border: 8px solid #f8e0f0;
            box-shadow: 0 10px 25px rgba(154, 91, 157, 0.3);
            position: relative;
        }

        .photo-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #f8e0f0, #e6cfea);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: #9c5b9d;
        }

        .photo-placeholder i {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .photo-caption {
            font-size: 1.4rem;
            color: #9c5b9d;
            font-weight: 500;
        }

        .details {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 40px;
        }

        .detail-box {
            flex: 1;
            min-width: 250px;
            background: #f9f0fa;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .detail-box:hover {
            transform: translateY(-5px);
        }

        .detail-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: #9c5b9d;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .detail-info {
            font-size: 1.4rem;
            line-height: 1.6;
        }

        .icon {
            font-size: 1.8rem;
        }

        .button-container {
            text-align: center;
            margin-top: 20px;
        }

        .rsvp-button {
            background: linear-gradient(to right, #d291bc, #9c5b9d);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 1.5rem;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(154, 91, 157, 0.4);
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
        }

        .rsvp-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(154, 91, 157, 0.5);
            background: linear-gradient(to right, #e0a9d0, #b070b1);
        }

        .rsvp-button:active {
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            padding: 25px;
            background-color: #f9f0fa;
            color: #7a4a7b;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .content {
                padding: 25px;
            }
            
            .detail-box {
                min-width: 100%;
            }
            
            .photo-frame {
                width: 220px;
                height: 220px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            
            .rsvp-button {
                padding: 18px 40px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="invitation-card">
        <div class="header">
            <h1>Приглашение</h1>
            <div class="subtitle">на день рождения Миланы</div>
        </div>
        
        <div class="content">
            <div class="photo-section">
                <div class="photo-frame">
                    <div class="photo-placeholder">
                      <img src="image/image.jpg" alt="Милана" style="width:100%; height:100%; object-fit:cover;">
                    </div>
                </div>
                <div class="photo-caption">Милана</div>
            </div>
            
            <div class="details">
                <div class="detail-box">
                    <div class="detail-title">
                        <span class="icon">📅</span>
                        <span>Дата и время</span>
                    </div>
                    <div class="detail-info">
                        24 января 2026 г.<br>
                        19:30
                    </div>
                </div>
                
                <div class="detail-box">
                    <div class="detail-title">
                        <span class="icon">📍</span>
                        <span>Место проведения</span>
                    </div>
                    <div class="detail-info">
                        Ул. Набережная Массалитинова, 3<br>
                        Сауна "Парнушка"
                    </div>
                </div>
            </div>
            
            <div class="button-container">
                <button class="rsvp-button" id="rsvpButton">Я приду!</button>
            </div>
        </div>
        
        <div class="footer">
            С нетерпением ждём встречи! 🎉
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const rsvpButton = document.getElementById('rsvpButton');
            
            rsvpButton.addEventListener('click', function() {
                // Анимация нажатия кнопки
                rsvpButton.style.transform = 'scale(0.95)';
                
                // Изменение текста и стиля кнопки
                rsvpButton.innerHTML = 'Отлично! Ждём тебя! 💖';
                rsvpButton.style.background = 'linear-gradient(to right, #a3d977, #6bc24a)';
                rsvpButton.style.boxShadow = '0 8px 20px rgba(107, 194, 74, 0.4)';
                
                // Восстановление размера кнопки после анимации
                setTimeout(() => {
                    rsvpButton.style.transform = 'scale(1)';
                }, 150);
                
                // Создание эффекта конфетти
                createConfetti();
                
                // Блокируем повторное нажатие
                rsvpButton.disabled = true;
            });
            
            function createConfetti() {
                const colors = ['#d291bc', '#9c5b9d', '#ff9a9e', '#fad0c4', '#a3d977'];
                
                for (let i = 0; i < 100; i++) {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.width = '10px';
                    confetti.style.height = '10px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-20px';
                    confetti.style.opacity = '0.8';
                    confetti.style.zIndex = '9999';
                    
                    document.body.appendChild(confetti);
                    
                    // Анимация падения
                    const animation = confetti.animate([
                        { transform: 'translateY(0) rotate(0deg)', opacity: 0.8 },
                        { transform: `translateY(${window.innerHeight + 20}px) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                    ], {
                        duration: 2000 + Math.random() * 3000,
                        easing: 'cubic-bezier(0.215, 0.61, 0.355, 1)'
                    });
                    
                    // Удаление конфетти после анимации
                    animation.onfinish = () => {
                        confetti.remove();
                    };
                }
            }
        });
    </script>
</body>
</html>
